<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Log in - Attendance Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="split">
            <aside class="aside">
                <p class="school">Polytechnic University of the Philippines<br>Santa Rosa Campus</p>
                <p class="course">COMP 143 - Web Development<br>Prof. Reyes</p>
                <h1>ATTENDANCE TRACKER</h1>
            </aside>
            <main class="main">
                <div class="card">
                    <h2>Log in</h2>
                    <p class="sub"></p>
                    <form data-next="student-home.html">
                        <label>
                            Email or Full name
                            <input type="text" name="id" autocomplete="username" required>
                        </label>
                        <label>
                            Password
                            <span class="pw"><input type="password" name="pw" autocomplete="current-password" required><button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg></button></span>
                        </label>
                        <label class="check">
                            <input type="checkbox" required>
                            <span>I agree to the collection and use of my information under the Data Privacy Act of 2012 (RA 10173).</span>
                        </label>
                        <button class="btn block" type="submit">Log in</button>
                    </form>
                    <div class="link-row">
                        <a href="forgot-password.html">Forgot Password?</a>
                        <span>No account? <a href="signup.html">Sign up</a></span>
                    </div>
                    <a href="index.html">Back to Home</a>
                </div>
            </main>
        </div>
        <script src="auth.js"></script>
    </body>
</html>
